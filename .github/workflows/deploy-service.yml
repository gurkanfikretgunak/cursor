name: Deploy Service

on:
  push:
    branches: [main]
    paths:
      - 'service/**'
      - '.github/workflows/deploy-service.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Service
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: service/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build service
        run: npm run build
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          # Only copy production dependencies
          cd deploy && npm ci --production
      
      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: service-deployment
          path: service/deploy
          retention-days: 7
      
      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Built' || '❌ Failed' }}"
          MESSAGE="<b>${STATUS}</b>%0A📦 <b>Repo:</b> ${{ github.repository }}%0A🌿 <b>Branch:</b> ${{ github.ref_name }}%0A🔖 <b>Commit:</b> <a href='https://github.com/${{ github.repository }}/commit/${{ github.sha }}'>${{ github.sha }}</a>%0A👤 <b>By:</b> ${{ github.actor }}%0A🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Run</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"
      
